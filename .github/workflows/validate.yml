name: Validate UniFi Optimizer changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python application
        run: python -m compileall -q app
      - name: Test roaming and RF decisions
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check app/static/app.js
